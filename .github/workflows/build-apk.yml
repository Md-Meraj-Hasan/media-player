name: Build Offline Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install web dependencies
        run: npm install
      - name: Build web assets
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Block internet permission
        run: node scripts/strip-internet-permission.cjs
      - name: Sync Capacitor assets
        run: npx cap sync android
      - name: Re-apply internet permission block
        run: node scripts/strip-internet-permission.cjs
      - name: Verify internet permission is blocked
        shell: bash
        run: |
          if grep -Eq '<uses-permission[^>]*android:name="android\.permission\.INTERNET"' android/app/src/main/AndroidManifest.xml && ! grep -q 'tools:node="remove"' android/app/src/main/AndroidManifest.xml; then
            echo "Internet permission block is missing"
            exit 1
          fi
          echo "Manifest contains an explicit INTERNET permission removal rule."
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meraj-media-player-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
