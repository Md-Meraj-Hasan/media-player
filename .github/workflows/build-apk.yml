
name: Build Offline Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - 
      - name: Diagnose project files
        shell: bash
        run: |
          echo "Current directory:"
          pwd
          echo "Root files:"
          ls -la
          echo "Required file locations:"
          find . -maxdepth 5 -type f \( \
            -name package.json -o \
            -name capacitor.config.json -o \
            -name index.html -o \
            -name strip-internet-permission.cjs \
          \) -print


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Block internet permission
        run: node scripts/strip-internet-permission.cjs

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Re-apply internet permission block
        run: node scripts/strip-internet-permission.cjs

      - name: Verify Android manifest
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST"
          grep -q 'tools:node="remove"' "$MANIFEST" || {
            echo "Internet permission removal rule missing."
            cat "$MANIFEST"
            exit 1
          }

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meraj-media-player-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
