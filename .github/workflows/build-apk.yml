name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'   # <-- Node version 18 se 20 kar diya gaya hai

      - name: Install Dependencies and Build Web Assets
        run: |
          npm install
          npm run build

      - name: Add Capacitor Android Platform & Sync
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Integrate Native Media / Sync Assets
        run: |
          if [ -f "scripts/integrate-native-media.cjs" ]; then
            node scripts/integrate-native-media.cjs
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./android

      - name: Build Debug APK
        run: ./gradlew assembleDebug
        working-directory: ./android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
