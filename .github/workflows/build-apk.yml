
name: Build Offline Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets
        run: npm run build

      - name: Verify built HTML and local assets
        run: node scripts/verify-web-assets.cjs dist

      - name: Generate Android project
        run: npx cap add android

      - name: Integrate native media permissions and scanner
        run: node scripts/integrate-native-media.cjs

      - name: Block internet permission
        run: node scripts/strip-internet-permission.cjs

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Re-apply internet permission block
        run: node scripts/strip-internet-permission.cjs

      - name: Verify Capacitor copied web assets
        run: node scripts/verify-web-assets.cjs android/app/src/main/assets/public

      - name: Verify Android manifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: Android manifest not found."
            exit 1
          fi

          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "ERROR: Internet permission is present."
            cat "$MANIFEST"
            exit 1
          fi

          if ! grep -q 'android.permission.READ_MEDIA_AUDIO' "$MANIFEST"; then
            echo "ERROR: Android audio permission is missing."
            cat "$MANIFEST"
            exit 1
          fi

          if ! grep -q 'android.permission.READ_EXTERNAL_STORAGE' "$MANIFEST"; then
            echo "ERROR: Legacy media read permission is missing."
            cat "$MANIFEST"
            exit 1
          fi

          echo "Internet permission block and audio permissions verified."

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK contains its referenced web assets
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          python3 - "$APK" <<'PYVERIFY'
          import posixpath, re, sys, zipfile

          apk = sys.argv[1]

          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              html_name = "assets/public/index.html"

              if html_name not in names:
                  raise SystemExit("APK is missing assets/public/index.html")

              html = z.read(html_name).decode("utf-8", "replace")
              refs = re.findall(r'''(?:src|href)=["']([^"']+)["']''', html)

              refs = [
                  ref for ref in refs
                  if not ref.startswith(
                      ("http:", "https:", "data:", "//", "/")
                  )
              ]

              for ref in refs:
                  clean_ref = ref.split("?", 1)[0].split("#", 1)[0]
                  target = posixpath.normpath(
                      posixpath.join("assets/public", clean_ref)
                  )

                  if target not in names:
                      raise SystemExit(
                          f"APK HTML references missing asset: {target}"
                      )

              if not any(
                  ref.split("?", 1)[0].endswith(".js") for ref in refs
              ):
                  raise SystemExit(
                      "APK HTML has no local JavaScript bundle reference"
                  )

              print("APK web assets verified:", len(refs), "local references")
          PYVERIFY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meraj-music-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
