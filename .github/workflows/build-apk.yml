
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Block internet permission
        run: node scripts/strip-internet-permission.cjs

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Re-apply internet permission block
        run: node scripts/strip-internet-permission.cjs

      - name: Verify internet permission removal rule
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST" || { echo "ERROR: Android manifest not found"; exit 1; }
          grep -q 'tools:node="remove"' "$MANIFEST" || {
            echo "ERROR: INTERNET permission removal rule missing from manifest"
            cat "$MANIFEST"
            exit 1
          }
          echo "Manifest contains an explicit INTERNET permission removal rule."

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meraj-media-player-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

