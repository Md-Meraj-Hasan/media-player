<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Meraj Video</title>
  <link rel="stylesheet" href="./video-src/css/style.css">
</head>
<body>
  <main class="app" id="app">
    <!-- Top Bar -->
    <div class="toolbar ui" id="toolbar">
      <div class="top-left">
        <button class="topbtn" id="collapseBtn" title="Back to Audio/Home">✕</button>
        <div class="speed-wrap">
          <button class="topbtn" id="speedBtn">1× ▾</button>
          <div class="speed-menu" id="speedMenu" hidden>
            <button data-speed="0.5">0.5×</button>
            <button data-speed="0.75">0.75×</button>
            <button data-speed="1">1× Normal</button>
            <button data-speed="1.25">1.25×</button>
            <button data-speed="1.5">1.5×</button>
            <button data-speed="1.75">1.75×</button>
            <button data-speed="2">2×</button>
          </div>
        </div>
        <div class="title" id="title">Choose or Scan Video</div>
      </div>
      <div class="top-right">
        <button class="topbtn" id="scanVideosBtn">⟳ Scan Videos</button>
        <input type="file" id="videoPicker" accept="video/*" multiple hidden>
      </div>
    </div>

    <!-- Video Stage -->
    <section class="stage" id="stage">
      <video class="video" id="video" playsinline></video>
      <div class="brightness-layer" id="brightness"></div>
      <div class="hint" id="hint">Tap video for controls · Swipe edges for Brightness/Volume</div>
      
      <!-- Center Controls -->
      <div class="center-controls ui" id="center">
        <button class="ctl" id="backBtn" aria-label="Seek back 10 seconds">↶<small style="font-size:10px;margin-left:-3px">10</small></button>
        <button class="ctl play" id="playBtn" aria-label="Play/Pause">▶</button>
        <button class="ctl" id="forwardBtn" aria-label="Seek forward 10 seconds">↷<small style="font-size:10px;margin-left:-3px">10</small></button>
      </div>

      <!-- Seekbar and Time -->
      <div class="seek-area ui" id="seekArea">
        <input class="seekbar" id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
        <div class="times">
          <span id="current">00:00</span>
          <span id="duration">00:00</span>
        </div>
      </div>

      <div class="level-line" id="levelLine"></div>
      <div class="locked-badge">🔒</div>
      <button class="unlock-tap" id="unlockTap" hidden aria-label="Unlock controls"></button>
    </section>

    <!-- Bottom Actions and Thumbnails Strip -->
    <footer class="bottom ui" id="bottom">
      <div class="icon-row">
        <button class="icon-btn" id="lockBtn" title="Lock controls">🔒</button>
        <button class="icon-btn" id="volBtn" title="Mute/Unmute">🔊</button>
        <button class="icon-btn" id="fitBtn" title="Fit/Fill">⛶</button>
        <button class="icon-btn" id="repeatBtn" title="Replay">⟳</button>
      </div>
      <div class="thumbs" id="thumbs" aria-label="Video list"></div>
    </footer>
  </main>

  <script type="module" src="./video-src/js/app.js"></script>
</body>
</html>
